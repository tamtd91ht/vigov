<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViGov — Nền tảng Điều hành số cấp Xã/Phường</title>
<style>
:root{
  --navy:#1B3A5C; --blue:#3B82C4; --pink:#E91E8C; --green:#27AE60;
  --orange:#E67E22; --purple:#8E44AD; --red:#E74C3C; --teal:#17A2A2;
  --bg:#FFFFFF; --bg2:#FAFBFC; --bd:#E5E8EB; --tx:#4A5568; --mut:#8896A6;
  --sh:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.ic{display:block;flex:none}
h1,h2,h3,h4{color:var(--navy);font-weight:700;line-height:1.3}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#D5DBE1;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- SIDEBAR ---------- */
.sb{position:fixed;top:0;left:0;bottom:0;width:240px;background:var(--navy);color:#fff;display:flex;flex-direction:column;z-index:40}
.sb-logo{padding:20px 20px 16px;display:flex;gap:11px;align-items:center;border-bottom:1px solid rgba(255,255,255,.09)}
.sb-logo .mark{width:36px;height:36px;border-radius:10px;background:var(--pink);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.5px}
.sb-logo b{display:block;font-size:17px;letter-spacing:.3px}
.sb-logo span{display:block;font-size:10.5px;color:rgba(255,255,255,.55);letter-spacing:.4px;text-transform:uppercase}
.sb-menu{padding:14px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.sb-cap{font-size:10.5px;letter-spacing:.8px;color:rgba(255,255,255,.38);text-transform:uppercase;padding:12px 12px 6px;font-weight:600}
.sb-item{position:relative;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:rgba(255,255,255,.74);cursor:pointer;font-size:13.5px;transition:.15s;border:none;background:none;width:100%;text-align:left}
.sb-item:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-item.on{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.sb-item.on::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;background:var(--pink);border-radius:0 3px 3px 0}
.sb-item .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.16);padding:1px 7px;border-radius:10px;font-weight:600}
.sb-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:rgba(255,255,255,.42)}

/* ---------- TOPBAR ---------- */
.main{margin-left:240px;min-height:100vh;background:#fff}
.tb{height:64px;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:20px;padding:0 28px;z-index:30}
.tb-title b{display:block;color:var(--navy);font-size:14.5px;font-weight:700;letter-spacing:.2px}
.tb-title span{display:block;font-size:11.5px;color:var(--mut)}
.tb-search{margin-left:8px;flex:1;max-width:400px;display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;color:var(--mut)}
.tb-search input{border:none;background:none;outline:none;width:100%;font-size:13px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icbtn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:#fff;display:grid;place-items:center;color:var(--tx);cursor:pointer}
.icbtn:hover{background:var(--bg2)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;padding:0 4px}
.user{display:flex;align-items:center;gap:10px;padding:5px 10px 5px 5px;border-radius:10px;cursor:pointer}
.user:hover{background:var(--bg2)}
.user b{display:block;font-size:13px;color:var(--navy)}
.user span{display:block;font-size:11.5px;color:var(--mut)}

/* ---------- PAGE ---------- */
.pg{padding:28px;max-width:1420px}
.pg-head{display:flex;align-items:flex-end;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.pg-head h1{font-size:22px}
.pg-head p{font-size:13px;color:var(--mut);margin-top:3px}
.pg-head .sp{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sec{display:none}
.sec.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.card{background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px}
.card-h h3{font-size:14.5px}
.card-h .sp{margin-left:auto;font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center}
.card-b{padding:20px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid var(--bd);background:#fff;color:var(--tx);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:#16314e}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:3px}
.seg button{border:none;background:none;padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:var(--sh)}
.sel{padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;font-size:12.5px;color:var(--tx);cursor:pointer;outline:none;min-width:150px}
.fchip{border:1px solid var(--bd);background:#fff;padding:7px 14px;border-radius:20px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--tx);transition:.15s}
.fchip:hover{border-color:#C9D2DA}
.fchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none;letter-spacing:.2px}
.av.lg{width:34px;height:34px;font-size:12.5px}
.pbar{height:6px;background:#EDF0F3;border-radius:4px;overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:4px;transition:width .4s}
.pbar.thick{height:12px;border-radius:6px}
.pbar.thick>i{border-radius:6px}
.muted{color:var(--mut)}
.tiny{font-size:11.5px}
.sm{font-size:12.5px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{position:relative;border-radius:12px;padding:18px 20px;border:1px solid var(--bd);box-shadow:var(--sh);cursor:pointer;transition:.18s;overflow:hidden}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(27,58,92,.10)}
.kpi .num{font-size:32px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
.kpi .lb{font-size:13px;font-weight:600;color:var(--navy);margin-top:4px}
.kpi .sub{font-size:11.5px;color:var(--mut);margin-top:2px}
.kpi .kic{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.75)}

/* ---------- CHARTS ---------- */
.split{display:grid;grid-template-columns:6fr 4fr;gap:18px;margin-top:18px}
.bars{display:flex;align-items:flex-end;gap:12px;height:180px;padding-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.bars .stack{width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;flex:1}
.bars .bar{width:46%;max-width:22px;border-radius:5px 5px 0 0;background:var(--blue);transition:height .5s;position:relative}
.bars .bar.b2{background:#DCE7F2}
.bars .lbl{font-size:11px;color:var(--mut)}
.bars .col:hover .bar{filter:brightness(1.08)}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--mut);align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.hbars{display:flex;flex-direction:column;gap:13px}
.hbar-row{display:grid;grid-template-columns:180px 1fr 52px;gap:12px;align-items:center;font-size:12.5px}
.hbar{height:10px;border-radius:5px;background:#EDF0F3;overflow:hidden}
.hbar>i{display:block;height:100%;border-radius:5px}

/* ---------- LIST ---------- */
.rows{display:flex;flex-direction:column}
.row-it{display:flex;gap:12px;align-items:flex-start;padding:13px 20px;border-bottom:1px solid var(--bd);cursor:pointer;transition:.13s}
.row-it:last-child{border-bottom:none}
.row-it:hover{background:var(--bg2)}
.row-it .t{font-size:13px;font-weight:600;color:var(--navy)}
.row-it .m{font-size:11.5px;color:var(--mut);margin-top:2px}

/* ---------- TABLE ---------- */
.tw{overflow-x:auto}
table.tb2{width:100%;border-collapse:collapse;font-size:12.8px}
table.tb2 th{text-align:left;padding:11px 14px;background:var(--bg2);color:var(--mut);font-weight:600;font-size:11.5px;border-bottom:1px solid var(--bd);white-space:nowrap}
table.tb2 td{padding:12px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}
table.tb2 tr:last-child td{border-bottom:none}
table.tb2 tbody tr{cursor:pointer;transition:.13s}
table.tb2 tbody tr:hover{background:var(--bg2)}
table.tb2 tr.late{background:rgba(231,76,60,.055)}
table.tb2 tr.late:hover{background:rgba(231,76,60,.09)}
table.tb2 .tt{font-weight:600;color:var(--navy)}

/* ---------- KANBAN ---------- */
.kb{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:14px;align-items:start}
.kbc{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:12px;min-height:180px}
.kbc-h{display:flex;align-items:center;gap:8px;padding:2px 4px 12px;font-size:12.5px;font-weight:700;color:var(--navy)}
.kbc-h .n{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:1px 8px;color:var(--mut)}
.tk{background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);cursor:pointer;margin-bottom:10px;overflow:hidden;transition:.15s}
.tk:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(27,58,92,.10)}
.tk .top{height:3px}
.tk .in{padding:12px 13px 13px}
.tk .ti{font-size:12.8px;font-weight:600;color:var(--navy);line-height:1.4}
.tk .src{display:inline-block;margin-top:8px;font-size:10.5px;padding:2px 8px;border-radius:6px;background:var(--bg2);border:1px solid var(--bd);color:var(--mut);font-weight:600}
.tk .ft{display:flex;align-items:center;gap:8px;margin-top:11px}

/* ---------- DRAWER ---------- */
.ovl{position:fixed;inset:0;background:rgba(27,58,92,.30);opacity:0;pointer-events:none;transition:.22s;z-index:50}
.ovl.on{opacity:1;pointer-events:auto}
.dw{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:96vw;background:#fff;transform:translateX(102%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:60;display:flex;flex-direction:column;box-shadow:-10px 0 36px rgba(27,58,92,.13)}
.dw.on{transform:none}
.dw-h{padding:20px 22px 16px;border-bottom:1px solid var(--bd);display:flex;gap:14px;align-items:flex-start}
.dw-h h3{font-size:16px;line-height:1.35}
.dw-h .m{font-size:12px;color:var(--mut);margin-top:4px}
.dw-b{overflow-y:auto;flex:1;padding:20px 22px 32px}
.dw-f{padding:14px 22px;border-top:1px solid var(--bd);display:flex;gap:9px;background:var(--bg2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin:6px 0 16px}
.tabs button{border:none;background:none;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--navy);border-bottom-color:var(--pink)}
.tp{display:none}.tp.on{display:block}
.fld{margin-bottom:16px}
.fld .k{font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.3px;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.fld .v{font-size:13px;color:var(--tx)}
.ocr{font-size:9.5px;background:rgba(142,68,173,.12);color:var(--purple);padding:1px 6px;border-radius:5px;font-weight:700;letter-spacing:.3px;text-transform:none}
.gsec{border-top:1px solid var(--bd);margin:20px 0 16px;padding-top:16px}
.gsec h4{font-size:12.5px;margin-bottom:12px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;margin-bottom:8px;cursor:pointer;background:#fff;transition:.13s}
.chk:hover{background:var(--bg2)}
.chk input{margin-top:2px;accent-color:var(--green);width:15px;height:15px;cursor:pointer}
.chk.done .lb{text-decoration:line-through;color:var(--mut)}
.chk .lb{font-size:12.5px}
.cmt{display:flex;gap:11px;margin-bottom:16px}
.cmt .bd{flex:1;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:10px 13px}
.cmt .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.cmt .hd b{font-size:12.5px;color:var(--navy)}
.cmt .hd span{font-size:11px;color:var(--mut)}
.cmt .tx{font-size:12.5px}
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:2px;background:var(--bd)}
.tl-it{position:relative;padding-bottom:16px}
.tl-it:last-child{padding-bottom:0}
.tl-it:before{content:"";position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--blue)}
.tl-it.ok:before{border-color:var(--green)}
.tl-it.cur:before{border-color:var(--orange);box-shadow:0 0 0 4px rgba(230,126,34,.15)}
.tl-it .t{font-size:12.8px;font-weight:600;color:var(--navy)}
.tl-it .m{font-size:11.5px;color:var(--mut);margin-top:2px}
.files{display:flex;gap:10px;flex-wrap:wrap}
.file{width:96px}
.file .ph{height:78px;border-radius:9px;border:1px solid var(--bd);background:linear-gradient(135deg,#EEF2F6,#E2E9F0);display:grid;place-items:center;color:#A8B6C4}
.file .nm{font-size:10.5px;color:var(--mut);margin-top:5px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scan{height:170px;border-radius:10px;border:1px dashed #C9D2DA;background:repeating-linear-gradient(0deg,#F4F6F8 0 22px,#EFF2F5 22px 24px);display:grid;place-items:center;color:#9AA8B6;font-size:12.5px;font-weight:600;gap:6px;margin-bottom:18px}
.note{background:rgba(59,130,196,.07);border:1px solid rgba(59,130,196,.22);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--navy)}

/* ---------- FEEDBACK ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.fb{border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;background:#fff;transition:.16s;display:flex;flex-direction:column}
.fb:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(27,58,92,.10)}
.fb .img{height:118px;display:grid;place-items:center;color:rgba(255,255,255,.9);font-size:11.5px;font-weight:700;letter-spacing:.4px;position:relative}
.fb .in{padding:13px 15px 15px;flex:1;display:flex;flex-direction:column}
.fb .cd{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.4px}
.fb .ti{font-size:13px;font-weight:600;color:var(--navy);margin:5px 0 6px;line-height:1.42}
.fb .ex{font-size:12px;color:var(--tx);margin-bottom:10px}
.fb .ft{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--bd)}
.sla{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700}
.stars{display:inline-flex;gap:1.5px;color:var(--orange)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ba .b{border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.ba .b .h{font-size:11px;font-weight:700;padding:6px 10px;text-align:center;letter-spacing:.3px}
.ba .b .p{height:110px;display:grid;place-items:center;color:rgba(255,255,255,.85);font-size:11px;font-weight:600}

/* ---------- MAP ---------- */
.mapwrap{position:relative;height:calc(100vh - 190px);min-height:520px;border-radius:12px;overflow:hidden;border:1px solid var(--bd);box-shadow:var(--sh);
  background:#EDF4EE;
  background-image:linear-gradient(rgba(39,174,96,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(39,174,96,.09) 1px,transparent 1px);
  background-size:52px 52px}
.road{position:absolute;background:#fff;box-shadow:0 0 0 1px #E1E7E3}
.river{position:absolute;background:rgba(59,130,196,.28);border-radius:40px}
.blk{position:absolute;background:rgba(39,174,96,.10);border:1px solid rgba(39,174,96,.16);border-radius:8px}
.mlbl{position:absolute;font-size:11px;color:#7C8F84;font-weight:600;letter-spacing:.3px;pointer-events:none}
.pin{position:absolute;width:15px;height:15px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1.5px 5px rgba(0,0,0,.28);cursor:pointer;transform:translate(-50%,-50%);transition:.15s}
.pin:hover{transform:translate(-50%,-50%) scale(1.35);z-index:8}
.mpanel{position:absolute;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 6px 22px rgba(27,58,92,.13);z-index:10}
.mpanel.l{top:18px;left:18px;width:252px}
.mpanel.r{top:18px;right:18px;width:264px}
.mpanel .h{padding:13px 16px;border-bottom:1px solid var(--bd);font-size:12.5px;font-weight:700;color:var(--navy)}
.mpanel .b{padding:10px 12px;max-height:calc(100vh - 300px);overflow-y:auto}
.lyr{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.3px}
.lyr:hover{background:var(--bg2)}
.lyr .n{margin-left:auto;font-size:11px;color:var(--mut);font-weight:600}
.sw{width:32px;height:18px;border-radius:10px;background:#D8DEE4;position:relative;transition:.18s;flex:none}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.lyr.on .sw{background:var(--green)}
.lyr.on .sw:after{left:16px}
.pop{position:absolute;width:250px;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 26px rgba(27,58,92,.18);z-index:20;transform:translate(-50%,calc(-100% - 16px));overflow:hidden}
.pop .h{padding:11px 14px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:flex-start}
.pop .h b{font-size:12.8px;color:var(--navy);line-height:1.35}
.pop .b{padding:11px 14px;display:flex;flex-direction:column;gap:7px}
.pop .r{display:flex;gap:8px;font-size:11.8px}
.pop .r .k{color:var(--mut);width:76px;flex:none}
.pop:after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-7px;width:12px;height:12px;background:#fff;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);transform:rotate(45deg)}
.pop.below{transform:translate(-50%,18px)}
.pop.below:after{bottom:auto;top:-7px;border:none;border-left:1px solid var(--bd);border-top:1px solid var(--bd)}
.pie{width:172px;height:172px;border-radius:50%;margin:4px auto 16px;position:relative}
.pie:after{content:"";position:absolute;inset:31%;background:#fff;border-radius:50%}
.pl{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0}
.pl .n{margin-left:auto;font-weight:700;color:var(--navy);font-size:12px}
.mstat{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px;padding-top:14px;border-top:1px solid var(--bd)}

function ic(name, size=18, stroke=1.7){
  return '<svg class="ic" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+stroke+'" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||'')+'</svg>';
}
function avatar(ten, lg){
  const cb = MOCK_DATA.canBo.find(c => c.ten === ten);
  const tat = cb ? cb.tat : (ten||'?').trim().split(' ').slice(-2).map(w=>w[0]).join('').toUpperCase();
  const mau = cb ? cb.mau : '#8896A6';
  return '<span class="av'+(lg?' lg':'')+'" style="background:'+mau+'" title="'+ten+'">'+tat+'</span>';
}
function mauNguoi(ten){ const c = MOCK_DATA.canBo.find(c=>c.ten===ten); return c ? c.mau : '#8896A6'; }
function chip(text, mau, bg){ return '<span class="chip" style="color:'+mau+';background:'+(bg||'rgba(0,0,0,.04)')+'">'+text+'</span>'; }
function pbar(pct, mau, thick){
  return '<div class="pbar'+(thick?' thick':'')+'"><i style="width:'+pct+'%;background:'+mau+'"></i></div>';
}
function mauTienDo(p){ return p>=80?'var(--green)': p>=50?'var(--blue)': p>=30?'var(--orange)':'var(--red)'; }
function toast(msg){
  const t = $('#toast'); t.innerHTML = ic('ok',17)+'<span>'+msg+'</span>'; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 2600);
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- Drawer ---------- */
function openDrawer(title, meta, body, foot){
  $('#dwTitle').innerHTML = title;
  $('#dwMeta').innerHTML = meta || '';
  $('#dwBody').innerHTML = body;
  $('#dwFoot').innerHTML = foot || '<button class="btn" data-dwclose>Đóng</button>';
  $('#dw').classList.add('on'); $('#ovl').classList.add('on');
  $('#dwBody').scrollTop = 0;
  bindTabs($('#dw'));
}
function closeDrawer(){ $('#dw').classList.remove('on'); $('#ovl').classList.remove('on'); }
function bindTabs(root){
  $$('.tabs', root).forEach(tabs => {
    tabs.onclick = e => {
      const b = e.target.closest('button'); if(!b) return;
      $$('button', tabs).forEach(x=>x.classList.remove('on')); b.classList.add('on');
      const wrap = tabs.parentElement;
      $$(':scope > .tp', wrap).forEach(p=>p.classList.remove('on'));
      const target = $(':scope > .tp[data-tp="'+b.dataset.tab+'"]', wrap);
      if(target) target.classList.add('on');
    };
  });
}

function lineChart(){
  const g = MOCK_DATA.giaiNganLuyKe, W=640, H=210, pl=44, pr=14, pt=12, pb=28;
  const max = 13, n = g.thang.length;
  const X = i => pl + i*(W-pl-pr)/(n-1);
  const Y = v => pt + (1 - v/max)*(H-pt-pb);
  const path = arr => arr.map((v,i)=> v==null?null:(i===0||arr[i-1]==null?'M':'L')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).filter(Boolean).join(' ');
  const grid = [0,3,6,9,12].map(v =>
    '<line x1="'+pl+'" y1="'+Y(v)+'" x2="'+(W-pr)+'" y2="'+Y(v)+'" stroke="#EDF0F3"/>'+
    '<text x="'+(pl-9)+'" y="'+(Y(v)+4)+'" fill="#8896A6" font-size="10.5" text-anchor="end">'+v+' tỷ</text>').join('');
  const lbl = g.thang.map((t,i)=>'<text x="'+X(i)+'" y="'+(H-8)+'" fill="#8896A6" font-size="10.5" text-anchor="middle">'+t+'</text>').join('');
  const dots = g.thucTe.map((v,i)=> v==null?'':'<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3.1" fill="#fff" stroke="#27AE60" stroke-width="2"/>').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:210px;display:block">'+grid+lbl+
    '<path d="'+path(g.keHoach)+'" fill="none" stroke="#E67E22" stroke-width="2.2" stroke-dasharray="6 4" stroke-linecap="round"/>'+
    '<path d="'+path(g.thucTe)+'" fill="none" stroke="#27AE60" stroke-width="2.6" stroke-linecap="round"/>'+dots+
    '<text x="'+(X(8)+8)+'" y="'+(Y(8.5)-10)+'" fill="#27AE60" font-size="11" font-weight="700">8,5 tỷ</text>'+
    '</svg>';
}

function dungHanChart(){
  const d = MOCK_DATA.baoCao.dungHanThang, W=620, H=200, pl=40, pr=14, pt=14, pb=28;
  const n = d.thang.length, min=60, max=100;
  const X = i => pl + i*(W-pl-pr)/(n-1);
  const Y = v => pt + (1-(v-min)/(max-min))*(H-pt-pb);
  const p = arr => arr.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const grid = [60,70,80,90,100].map(v=>'<line x1="'+pl+'" y1="'+Y(v)+'" x2="'+(W-pr)+'" y2="'+Y(v)+'" stroke="#EDF0F3"/>'+
    '<text x="'+(pl-8)+'" y="'+(Y(v)+4)+'" fill="#8896A6" font-size="10.5" text-anchor="end">'+v+'%</text>').join('');
  const lbl = d.thang.map((t,i)=>'<text x="'+X(i)+'" y="'+(H-8)+'" fill="#8896A6" font-size="10.5" text-anchor="middle">'+t+'</text>').join('');
  const dots = d.nam2026.map((v,i)=>'<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3.1" fill="#fff" stroke="#3B82C4" stroke-width="2"/>').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:200px;display:block">'+grid+lbl+
    (bcSoSanh?'<path d="'+p(d.nam2025)+'" fill="none" stroke="#C9D6E3" stroke-width="2.2" stroke-dasharray="6 4" stroke-linecap="round"/>':'')+
    '<path d="'+p(d.nam2026)+'" fill="none" stroke="#3B82C4" stroke-width="2.6" stroke-linecap="round"/>'+dots+'</svg>';
}

  $('#btnHelp').innerHTML = ic('help',18);
  $('#dwClose').innerHTML = ic('close',17);
  $('#userBox').innerHTML = '<span class="av lg" style="background:var(--navy)">'+d.nguoiDung.tat+'</span>'+
    '<div><b>'+d.nguoiDung.ten+'</b><span>'+d.nguoiDung.chucVu+'</span></div>';
  $('#menu').innerHTML =
    '<div class="sb-cap">Điều hành</div>'+
    MENU.slice(0,6).map(m => menuBtn(m)).join('')+
    '<div class="sb-cap">Quản trị</div>'+
    MENU.slice(6).map(m => menuBtn(m)).join('');
}
function menuBtn(m){
  return '<button class="sb-item" data-id="'+m.id+'">'+ic(m.ic,17)+'<span>'+m.ten+'</span>'+
    (m.cnt?'<span class="cnt">'+m.cnt+'</span>':'')+'</button>';
}

document.addEventListener('click', e => {
  const t = e.target;
  // điều hướng
  const mi = t.closest('.sb-item'); if(mi){ nav(mi.dataset.id); return; }
  const nv = t.closest('[data-nav]'); if(nv){ nav(nv.dataset.nav); return; }
  // đóng drawer
  if(t.closest('[data-dwclose]') || t.id==='dwClose' || t.closest('#dwClose') || t.id==='ovl'){ closeDrawer(); return; }
  // thông báo giả lập
  const tt = t.closest('[data-toast]'); if(tt){ toast(tt.dataset.toast); return; }
  const xu = t.closest('[data-xuat]'); if(xu){ toast('Đã tạo tệp báo cáo định dạng '+xu.dataset.xuat+' · Hệ thống sẽ gửi vào hộp thư của bạn'); return; }
  // mở chi tiết
  const nvi = t.closest('[data-nv]'); if(nvi){ openTask(nvi.dataset.nv); return; }
  const vb  = t.closest('[data-vb]'); if(vb){ openDoc(vb.dataset.vb); return; }
  const hm  = t.closest('[data-hm]'); if(hm){ openFund(hm.dataset.hm); return; }
  const pa  = t.closest('[data-pa]'); if(pa){ openPA(pa.dataset.pa); return; }
  // bản đồ
  if(t.closest('[data-popclose]')){ $$('.pop').forEach(p=>p.remove()); return; }
  const gh = t.closest('[data-ghim]'); if(gh){ openGhim(gh.dataset.ghim); return; }
  const lp = t.closest('[data-lop]'); if(lp){ bdLop[lp.dataset.lop] = !bdLop[lp.dataset.lop]; renderMap(); return; }
  if(manHienTai==='map' && !t.closest('.pop') && !t.closest('.mpanel')) $$('.pop').forEach(p=>p.remove());
  // lọc phản ánh theo lĩnh vực
  const lv = t.closest('[data-lv]');
  if(lv){
    const v = lv.dataset.lv;
    paLoc = paLoc.includes(v) ? paLoc.filter(x=>x!==v) : paLoc.concat(v);
    renderFeedback(); return;
  }
  if(t.id==='paClear'){ paLoc=[]; renderFeedback(); return; }
  // nhiệm vụ: chế độ xem, xoá lọc, giao việc
  const sv = t.closest('#segView button'); if(sv){ tvView = sv.dataset.v; renderTasks(); return; }
  if(t.id==='btnXoaLoc'){ tvLoc={bp:'',ng:'',tt:'',nguon:''}; renderTasks(); return; }
  if(t.id==='btnGiaoViec'){ toast('Đã mở biểu mẫu giao việc mới'); return; }
  if(t.id==='btnKy'){ toast('Kỳ số liệu hiện tại: tháng 8 năm 2026'); return; }
  // văn bản: chuyển tab
  const sb = t.closest('#segVb button'); if(sb){ vbTab = sb.dataset.t; renderDocs(); return; }
  // báo cáo: kỳ và so sánh
  const sk = t.closest('#segKy button'); if(sk){ bcKy = sk.dataset.k; renderReport(); return; }
  if(t.closest('#btnSoSanh')){ bcSoSanh = !bcSoSanh; renderReport(); return; }
  // cấu hình: chuyển tab
  const ct = t.closest('#chTabs button'); if(ct){ chTab = ct.dataset.tab; renderConfig(); return; }
});

document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='fBp'){ tvLoc.bp = t.value; renderTasks(); }
  if(t.id==='fNg'){ tvLoc.ng = t.value; renderTasks(); }
  if(t.id==='fTt'){ tvLoc.tt = t.value; renderTasks(); }
  if(t.id==='fNguon'){ tvLoc.nguon = t.value; renderTasks(); }
  if(t.dataset && t.dataset.sla !== undefined){
    MOCK_DATA.cauHinh.sla[+t.dataset.sla][t.dataset.f] = +t.value;
    toast('Đã cập nhật thời hạn lĩnh vực '+MOCK_DATA.cauHinh.sla[+t.dataset.sla].lv);
  }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') { closeDrawer(); $$('.pop').forEach(p=>p.remove()); } });
$('#searchInput').addEventListener('keydown', e => {
  if(e.key==='Enter' && e.target.value.trim()){ toast('Đang tìm kiếm: “'+e.target.value.trim()+'”'); }
});

initShell();
nav('overview');
</script>
</body>
</html>
