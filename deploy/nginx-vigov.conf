# =============================================================================
# ViGov — cấu hình reverse proxy nginx, ĐẶT TRÊN MÁY GATEWAY (.151)
#
# ⚠ KHÔNG đặt file này lên máy ứng dụng .135. Máy .135 KHÔNG cài nginx trên
#   host — ở đó mọi thứ là container và các cổng 3000/3001/8085 được mở thẳng
#   ra LAN (PUBLIC_BIND_IP=0.0.0.0). Gateway .151 mới là nơi kết thúc TLS.
#
#   Luồng:  trình duyệt --https--> .151 (nginx này) --http--> .135:<cổng>
#
# ⚠ TRƯỚC KHI COPY: .151 nhiều khả năng ĐÃ có cấu hình cho 3 domain này.
#   Kiểm tra bằng:  grep -rn "vigov.omicrm.com" /etc/nginx/
#   Có rồi thì HỢP NHẤT (chỉ chèn thêm location còn thiếu), đừng copy đè —
#   trùng server_name làm nginx bỏ qua block sau và bạn mất cấu hình cũ.
#   File này khi đó đóng vai trò bản tham chiếu cho trạng thái mong muốn.
#
# Đặt tại: /etc/nginx/sites-available/vigov  rồi symlink sang sites-enabled/
#   (bản CentOS không có 2 thư mục đó thì dùng /etc/nginx/conf.d/vigov.conf)
# Chứng thư TLS: certbot cấp trên chính .151 (xem deploy/README.md).
#
# Tên miền đã chốt: admin-vigov.omicrm.com · api-vigov.omicrm.com · miniapp-vigov.omicrm.com
# =============================================================================

# Máy ứng dụng. Đổi IP ở ĐÚNG MỘT CHỖ này khi dời máy.
upstream vigov_backend      { server 192.168.3.135:3001; }
upstream vigov_admin_web    { server 192.168.3.135:3000; }
upstream vigov_miniapp      { server 192.168.3.135:8085; }

# ─── Chuyển toàn bộ HTTP sang HTTPS ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin-vigov.omicrm.com api-vigov.omicrm.com miniapp-vigov.omicrm.com;

    # Chừa đường cho certbot gia hạn chứng thư
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── API backend ────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-vigov.omicrm.com;

    ssl_certificate     /etc/letsencrypt/live/api-vigov.omicrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-vigov.omicrm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Không lộ phiên bản nginx
    server_tokens off;

    # Tệp tải lên tối đa 20 MiB — phải khớp STORAGE_MAX_FILE_SIZE của backend
    client_max_body_size 21m;

    # ── Xác thực quyền sở hữu tên miền cho Zalo Developer Console ───────────
    # Zalo phát một tệp HTML tên ngẫu nhiên rồi tự gọi vào
    #     https://api-vigov.omicrm.com/zalo_verifier<chuỗi>.html
    # để xác nhận ta thực sự kiểm soát máy chủ này. Phải để nginx trả thẳng:
    # backend NestJS chỉ phục vụ dưới prefix `api/v1`, đi qua proxy_pass là 404
    # và Zalo báo xác thực thất bại. Tệp nằm trên CHÍNH GATEWAY này, không
    # phải trên máy .135.
    #
    # Dùng regex thay vì gõ cứng tên tệp — chuỗi Zalo sinh ra lẫn `I` hoa với
    # `l` thường, chép tay sai một ký tự là hỏng. Cứ đặt tệp vào thư mục dưới
    # đây với ĐÚNG tên gốc, không cần sửa lại cấu hình này.
    #
    # ĐỪNG XOÁ tệp sau khi xác thực xong: Zalo kiểm tra lại định kỳ, mất tệp là
    # domain bị thu hồi trạng thái đã xác minh.
    location ~ ^/zalo_verifier[A-Za-z0-9_\-]+\.html$ {
        root /var/www/zalo-verify;
        access_log off;
    }

    location / {
        proxy_pass http://vigov_backend;
        proxy_http_version 1.1;

        # Backend đọc IP thật từ đây (TRUST_PROXY=1) để rate-limit và ghi log đúng
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # Socket.IO (P5-05) cần nâng cấp kết nối lên WebSocket
    location /realtime/ {
        proxy_pass http://vigov_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Kết nối realtime giữ lâu — đừng để nginx cắt sớm
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ─── Web Quản trị ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin-vigov.omicrm.com;

    ssl_certificate     /etc/letsencrypt/live/admin-vigov.omicrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-vigov.omicrm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    location / {
        proxy_pass http://vigov_admin_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── Bản xem trước Zalo Mini App trên trình duyệt ───────────────────────────
# LƯU Ý: bản chính thức trên Zalo KHÔNG chạy từ máy chủ này — bundle được
# `zmp deploy` tải thẳng lên hạ tầng Zalo. Server này chỉ để nội bộ xem trước
# và cho khách nghiệm thu trước khi nộp kiểm duyệt.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name miniapp-vigov.omicrm.com;

    ssl_certificate     /etc/letsencrypt/live/miniapp-vigov.omicrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miniapp-vigov.omicrm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    location / {
        # Cổng 8085 do ZALO_MINIAPP_PORT trong .env của máy .135 quyết định,
        # ánh xạ vào cổng 8080 BÊN TRONG container. Sửa .env thì sửa upstream.
        proxy_pass http://vigov_miniapp;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
