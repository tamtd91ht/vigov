# =============================================================================
# ViGov — cấu hình reverse proxy nginx trên VPS
#
# Đặt tại: /etc/nginx/sites-available/vigov  rồi symlink sang sites-enabled/
# Chứng thư TLS: certbot cấp (xem deploy/README.md).
#
# Vai trò: kết thúc TLS, ép HTTP→HTTPS, chuyển tiếp vào các container đang
# lắng nghe trên 127.0.0.1 (docker-compose mặc định KHÔNG mở cổng ra Internet).
#
# Thay <tên-miền> bằng tên miền thật trước khi dùng.
# =============================================================================

# ─── Chuyển toàn bộ HTTP sang HTTPS ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name quantri.vigov.<tên-miền> api.vigov.<tên-miền> miniapp.vigov.<tên-miền>;

    # Chừa đường cho certbot gia hạn chứng thư
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── API backend ────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.vigov.<tên-miền>;

    ssl_certificate     /etc/letsencrypt/live/api.vigov.<tên-miền>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vigov.<tên-miền>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Không lộ phiên bản nginx
    server_tokens off;

    # Tệp tải lên tối đa 20 MiB — phải khớp STORAGE_MAX_FILE_SIZE của backend
    client_max_body_size 21m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Backend đọc IP thật từ đây (TRUST_PROXY=1) để rate-limit và ghi log đúng
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # Socket.IO (P5-05) cần nâng cấp kết nối lên WebSocket
    location /realtime/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Kết nối realtime giữ lâu — đừng để nginx cắt sớm
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ─── Web Quản trị ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name quantri.vigov.<tên-miền>;

    ssl_certificate     /etc/letsencrypt/live/quantri.vigov.<tên-miền>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantri.vigov.<tên-miền>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── Bản xem trước Zalo Mini App trên trình duyệt ───────────────────────────
# LƯU Ý: bản chính thức trên Zalo KHÔNG chạy từ máy chủ này — bundle được
# `zmp deploy` tải thẳng lên hạ tầng Zalo. Server này chỉ để nội bộ xem trước
# và cho khách nghiệm thu trước khi nộp kiểm duyệt.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name miniapp.vigov.<tên-miền>;

    ssl_certificate     /etc/letsencrypt/live/miniapp.vigov.<tên-miền>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miniapp.vigov.<tên-miền>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    location / {
        # Cổng host do ZALO_MINIAPP_PORT trong .env quyết định (mặc định 8085),
        # ánh xạ vào cổng 8080 BÊN TRONG container. Sửa .env thì sửa cả dòng này.
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
