# =============================================================================
# ViGov — khối cấu hình BỔ SUNG cho nginx gateway .151
#
# Dành cho: team vận hành máy .151 (gateway production của dự án khác).
# Mục tiêu: thêm 3 tên miền của ViGov mà KHÔNG chạm vào bất kỳ luồng nào đang
#           chạy trên máy. Xem hướng dẫn kèm theo trước khi áp dụng.
#
# ĐẶT THÀNH MỘT TỆP RIÊNG, KHÔNG SỬA TỆP CÓ SẴN:
#     /etc/nginx/conf.d/vigov.conf
#   (hoặc /etc/nginx/sites-available/vigov + symlink sang sites-enabled/)
#
# CAM KẾT CÁCH LY — tệp này chỉ chứa:
#   · 3 server_name mới, chưa từng tồn tại trên máy
#   · 3 upstream mang tiền tố vigov_ (không đụng tên upstream có sẵn)
#   · log riêng /var/log/nginx/vigov-*.log
#   Không có default_server. Không sửa http{} hay nginx.conf. Không đụng
#   server block nào khác. Gỡ ra = xoá đúng tệp này rồi reload.
#
# TƯƠNG THÍCH nginx < 1.25.1:
#   Dòng `http2 on;` chỉ có từ 1.25.1. Máy chạy bản cũ hơn thì XOÁ dòng đó và
#   đổi `listen 443 ssl;` thành `listen 443 ssl http2;`. Kiểm tra: nginx -v
#
# TẠM THỜI: đây là giai đoạn testing, ViGov sẽ chuyển sang VPS + nginx riêng.
# =============================================================================

# ─── Máy ứng dụng (.135) ─────────────────────────────────────────────────────
# Dời máy sau này chỉ sửa 3 dòng này. Tiền tố vigov_ để không trùng upstream
# của các dự án khác trên gateway.
#
# keepalive_timeout ở đây PHẢI nhỏ hơn keepAliveTimeout của Node phía .135
# (đang đặt 65s trong backend/apps/api-gateway/src/main.ts và biến
# KEEP_ALIVE_TIMEOUT của admin-web). Ngược lại là nginx tái dùng socket Node
# vừa đóng rồi trả 502 gần như tức thì — hay gặp nhất khi traffic thưa.
upstream vigov_backend   { server 192.168.3.135:3001; keepalive 32; keepalive_timeout 60s; }
upstream vigov_admin_web { server 192.168.3.135:3000; keepalive 32; keepalive_timeout 60s; }
upstream vigov_miniapp   { server 192.168.3.135:8085; keepalive 32; keepalive_timeout 60s; }

# ─── HTTP: ACME + ép sang HTTPS ─────────────────────────────────────────────
# KHÔNG có default_server: block này chỉ nhận đúng 3 tên miền dưới đây, mọi
# host khác vẫn rơi về default_server sẵn có của máy.
server {
    listen 80;
    listen [::]:80;
    server_name api-vigov.omicrm.com admin-vigov.omicrm.com miniapp-vigov.omicrm.com;

    # Chừa đường cho certbot gia hạn. Nếu máy đã có webroot ACME dùng chung,
    # đổi root bên dưới cho khớp thay vì tạo thư mục mới.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── API backend ────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-vigov.omicrm.com;

    ssl_certificate     /etc/letsencrypt/live/api-vigov.omicrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-vigov.omicrm.com/privkey.pem;

    access_log /var/log/nginx/vigov-api.access.log;
    error_log  /var/log/nginx/vigov-api.error.log;

    # Chỉ áp cho server block này, không ảnh hưởng giới hạn chung của máy.
    # Phải khớp STORAGE_MAX_FILE_SIZE=20 MiB của backend.
    client_max_body_size 21m;

    # Xác thực quyền sở hữu tên miền cho Zalo Developer Console.
    # Zalo phát một tệp HTML tên ngẫu nhiên rồi tự gọi vào
    #     https://api-vigov.omicrm.com/zalo_verifier<chuỗi>.html
    # Tệp nằm trên CHÍNH GATEWAY này. Đẩy xuống .135 sẽ ra 404 vì backend
    # NestJS chỉ phục vụ dưới prefix api/v1.
    # ĐỪNG XOÁ tệp sau khi xác thực xong: Zalo kiểm tra lại định kỳ.
    location ~ ^/zalo_verifier[A-Za-z0-9_\-]+\.html$ {
        root /var/www/zalo-verify;
        access_log off;
    }

    location / {
        proxy_pass http://vigov_backend;
        proxy_http_version 1.1;
        # Bắt buộc để dùng được keepalive pool khai ở upstream. Thiếu dòng này
        # là mỗi request mở một kết nối mới. KHÔNG đặt trong /realtime/.
        proxy_set_header Connection        "";

        # Backend đặt TRUST_PROXY=1 và đọc IP thật từ đây để rate-limit và ghi
        # log đúng. Thiếu X-Forwarded-For thì mọi người dùng bị tính chung IP.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # Socket.IO cần nâng cấp kết nối lên WebSocket.
    # Timeout dài chỉ áp trong location này của riêng ViGov.
    location /realtime/ {
        proxy_pass http://vigov_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ─── Web Quản trị ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin-vigov.omicrm.com;

    ssl_certificate     /etc/letsencrypt/live/admin-vigov.omicrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-vigov.omicrm.com/privkey.pem;

    access_log /var/log/nginx/vigov-admin.access.log;
    error_log  /var/log/nginx/vigov-admin.error.log;

    # KHUYẾN NGHỊ giai đoạn testing: đây là trang quản trị nội bộ, chỉ nên mở
    # cho dải IP văn phòng. Bỏ chú thích và điền dải thật rồi reload.
    # allow 203.0.113.0/24;
    # deny  all;

    location / {
        proxy_pass http://vigov_admin_web;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── Bản xem trước Zalo Mini App ────────────────────────────────────────────
# Bản chính thức KHÔNG chạy từ đây — bundle được `zmp deploy` đẩy thẳng lên hạ
# tầng Zalo. Server này chỉ để nội bộ xem trước và khách nghiệm thu.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name miniapp-vigov.omicrm.com;

    ssl_certificate     /etc/letsencrypt/live/miniapp-vigov.omicrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miniapp-vigov.omicrm.com/privkey.pem;

    access_log /var/log/nginx/vigov-miniapp.access.log;
    error_log  /var/log/nginx/vigov-miniapp.error.log;

    # Cùng khuyến nghị như trên — bản xem trước, không phải dịch vụ công khai.
    # allow 203.0.113.0/24;
    # deny  all;

    location / {
        # Cổng 8085 do ZALO_MINIAPP_PORT trong .env của .135 quyết định, ánh xạ
        # vào cổng 8080 BÊN TRONG container. Đổi .env thì sửa upstream ở đầu tệp.
        proxy_pass http://vigov_miniapp;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
