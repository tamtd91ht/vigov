apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Không áp trực tiếp thư mục này — luôn đi qua overlay:
#   kubectl apply -k k8s/overlays/staging
#
# secret.example.yaml CỐ Ý không nằm trong danh sách: nó chỉ là bảng tra tên
# biến. Secret thật tạo bằng kubectl / Sealed Secrets / External Secrets —
# xem hướng dẫn trong chính tệp đó.
resources:
  - namespace.yaml
  - configmap.yaml
  - services.yaml
  - backend-deployment.yaml
  - frontend-deployments.yaml
  - uploads-pvc.yaml
  # Bỏ dòng dưới nếu chọn "Hướng 2: Mongo/RabbitMQ ngoài cụm"
  # (docs/05-TRIEN-KHAI-K8S.md mục 3.3) — khi đó chỉ cần trỏ MONGO_URI và
  # RABBITMQ_URI trong Secret sang máy ngoài.
  - stateful-mongo-rabbitmq.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: vigov
