# ⚠ TỆP MẪU — CHỈ LIỆT KÊ TÊN BIẾN, KHÔNG CHỨA GIÁ TRỊ
#
# KHÔNG BAO GIỜ commit một Secret có giá trị thật vào git. Kubernetes lưu Secret
# dạng base64 — đó là mã hoá HIỂN THỊ, không phải mã hoá bảo mật: ai đọc được
# tệp là đọc được mật khẩu bằng một lệnh `base64 -d`.
#
# Tệp này KHÔNG nằm trong kustomization.yaml nên `kubectl apply -k` sẽ không áp
# nó. Nó chỉ để tra xem Secret cần những khoá nào. Tạo Secret thật bằng một
# trong ba cách ở mục "Cách tạo" bên dưới.
#
# Dạng đầy đủ của từng biến (kể cả khuôn chuỗi kết nối) tra ở ../../.env.example.
# Giá trị thật của từng môi trường nằm trên máy chủ hoặc trong kho bí mật của tổ
# chức, không nằm trong repo.

apiVersion: v1
kind: Secret
metadata:
  name: vigov-secrets
type: Opaque
stringData: {}
  # Các khoá BẮT BUỘC phải có (để trống ở đây một cách có chủ ý):
  #
  # --- Xác thực ---
  #   JWT_SECRET
  #       Ký CẢ token đăng nhập LẪN link tệp riêng tư. Cần >= 32 ký tự.
  #       Sinh bằng: openssl rand -base64 48
  #       Backend từ chối khởi động ở production nếu còn giá trị mẫu.
  #
  # --- MongoDB ---
  #   MONGO_ROOT_USERNAME
  #   MONGO_ROOT_PASSWORD
  #   MONGO_URI
  #       Trỏ tới Service "mongo" cổng 27017, database "vigov".
  #       Phải kèm tham số authSource=admin — thiếu là backend không bao giờ
  #       healthy, và thông báo lỗi không nói rõ nguyên nhân.
  #
  # --- RabbitMQ ---
  #   RABBITMQ_DEFAULT_USER
  #   RABBITMQ_DEFAULT_PASS
  #   RABBITMQ_URI
  #       Trỏ tới Service "rabbitmq" cổng 5672.
  #       Phải xoá tài khoản guest mặc định trước khi lên production.
  #
  # --- Lối vào tạm ---
  #   CITIZEN_OTP_BYPASS_CODE
  #       PHẢI ĐỂ TRỐNG ở production. Còn giá trị là còn một mã cố định định
  #       danh được BẤT KỲ số điện thoại nào của công dân.
  #       → ../../SECURITY.md mục 4, việc 0.
  #
  # --- Zalo (điền khi khách cấp OA + Mini App) ---
  #   ZALO_OA_ID · ZALO_APP_ID · ZALO_APP_SECRET · ZALO_OA_ACCESS_TOKEN
  #   ZNS_TEMPLATE_FEEDBACK_RECEIVED · ZNS_TEMPLATE_FEEDBACK_RESOLVED
  #
  # --- Bên thứ 3 (chỉ khi đổi *_PROVIDER khỏi "mock") ---
  #   OCR_API_KEY · IDCARD_API_KEY · GEO_API_KEY
  #
  # --- Object storage (chỉ khi STORAGE_DRIVER=s3) ---
  #   S3_ENDPOINT · S3_BUCKET · S3_ACCESS_KEY · S3_SECRET_KEY

# ─────────────────────────────────────────────────────────────────────────────
# CÁCH TẠO SECRET THẬT
#
# A. Tạo tay trên cụm (đơn giản nhất, phù hợp một cụm)
#
#      kubectl -n vigov create secret generic vigov-secrets \
#        --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#        --from-literal=MONGO_ROOT_USERNAME='...' \
#        --from-literal=MONGO_ROOT_PASSWORD='...' \
#        --from-literal=MONGO_URI='...' \
#        --from-literal=RABBITMQ_DEFAULT_USER='...' \
#        --from-literal=RABBITMQ_DEFAULT_PASS='...' \
#        --from-literal=RABBITMQ_URI='...' \
#        --from-literal=CITIZEN_OTP_BYPASS_CODE=''
#
#    Dùng dấu nháy đơn để shell không diễn giải ký tự đặc biệt trong mật khẩu.
#    Đặt một dấu cách ở đầu dòng lệnh để bash không ghi nó vào ~/.bash_history.
#
# B. Sealed Secrets — commit được vào git ở dạng đã mã hoá bằng khoá của cụm
#
#      kubeseal --format yaml < tep-secret-nam-ngoai-git.yaml > sealed-secret.yaml
#
# C. External Secrets Operator — lấy từ Vault / AWS Secrets Manager / Azure Key Vault
#    Phù hợp khi tổ chức đã có kho bí mật tập trung.
#
# LƯU Ý: Secret không tự nạp lại. Đổi giá trị xong phải khởi động lại pod:
#      kubectl -n vigov rollout restart deployment/backend
# ─────────────────────────────────────────────────────────────────────────────
