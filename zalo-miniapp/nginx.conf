# =============================================================================
# ViGov — Zalo Mini App · cấu hình nginx phục vụ SPA tĩnh
# Thay thế /etc/nginx/nginx.conf trong ảnh nginx:alpine.
#
# Ba mục tiêu:
#   1. SPA fallback  — mọi route do react-router xử lý đều trả index.html.
#   2. gzip          — giảm ~70% dung lượng JS/CSS trên mạng 3G/4G ở xã.
#   3. Chiến lược cache 2 tầng:
#        · /assets/*  → tên file có hash do Vite sinh ⇒ immutable, cache 1 năm.
#        · index.html → KHÔNG cache, để bản deploy mới có hiệu lực ngay.
# =============================================================================

# Không có chỉ thị `user`: container chạy sẵn bằng user `nginx` (xem Dockerfile),
# nếu khai báo `user` khi master không phải root nginx sẽ cảnh báo.
worker_processes  auto;

# User không-root không ghi được /var/run ⇒ chuyển pid sang /tmp.
pid /tmp/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Các thư mục tạm mặc định nằm trong /var/cache/nginx — đã chown cho user nginx.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Ẩn phiên bản nginx trong header/lỗi (yêu cầu rà soát bảo mật P4-36).
    server_tokens off;

    # --- Nén gzip -------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    server {
        # Cổng không đặc quyền vì tiến trình chạy bằng user nginx.
        listen       8080;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Giới hạn body: mini app chỉ upload ảnh phản ánh qua API backend,
        # nginx này không nhận upload nên để nhỏ.
        client_max_body_size 2m;

        # --- Header an toàn cơ bản -------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # --- Endpoint cho HEALTHCHECK / load balancer ------------------------
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # --- Asset có hash trong tên (Vite: assetsDir = "assets") ------------
        # Ví dụ: /assets/index-B7xK9a2f.js — nội dung đổi thì tên đổi,
        # nên cache vĩnh viễn phía trình duyệt/CDN là an toàn.
        location /assets/ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # --- Ảnh/font đặt trong public/ (không có hash) ----------------------
        # Cache ngắn hơn và bắt buộc revalidate để thay logo/icon có hiệu lực sớm.
        location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            try_files $uri =404;
        }

        # --- index.html: TUYỆT ĐỐI không cache --------------------------------
        # Nếu cache, người dùng sẽ giữ mãi bản HTML cũ trỏ tới file assets đã bị
        # xoá sau lần deploy kế tiếp ⇒ trang trắng.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires -1;
        }

        # --- SPA fallback -----------------------------------------------------
        # react-router dùng history API ⇒ URL sâu (/feedback/123) không tồn tại
        # dưới dạng file; trả index.html để client tự định tuyến.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Trang lỗi cũng trả về SPA để giữ trải nghiệm liền mạch.
        error_page 404 /index.html;
    }
}
